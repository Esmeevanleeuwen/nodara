services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/storage/app
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nodara}
      MYSQL_USER: ${DB_USERNAME:-nodara}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
  uploads:
